<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent — Amond Beauty</title>
  <meta name="description" content="Thank you for contacting Amond Beauty. We'll be in touch within 24 hours." />
  <meta name="author" content="Amond Beauty" />
  <meta name="robots" content="noindex" />

  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
</head>
<body>

  <main id="main-content" class="ab-thankyou-wrap">
    <div class="ab-thankyou-panel">
      <div class="ab-thankyou-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>

      <h1>Thank you!</h1>
      <p>Your message has been sent. We'll get back to you within 24 hours.</p>

      <div class="ab-submission-details" id="submission-details" role="region" aria-label="Your submission details">
        <h3>Your submission</h3>
        <div id="submission-data"></div>
      </div>

      <div class="ab-thankyou-actions">
        <a href="index.html" class="ab-action ab-action-primary">Back to Home</a>
        <a href="catalog.html" class="ab-action ab-action-outline">Shop Our Bars</a>
      </div>
    </div>
  </main>

  <script type="module" src="scripts/thankyou.js"></script>
</body>
</html>

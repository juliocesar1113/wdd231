<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 575">
  <rect width="460" height="575" fill="#F2DDD1"/>

  <!-- Background organic shape -->
  <ellipse cx="280" cy="300" rx="160" ry="220" fill="#E8C5B0" opacity="0.4"/>
  <ellipse cx="180" cy="260" rx="120" ry="180" fill="#D4A88F" opacity="0.2"/>

  <!-- Bar 1: large shampoo bar, center-left -->
  <g transform="translate(80,160) rotate(-12)">
    <rect width="130" height="60" rx="20" fill="#C9967A"/>
    <rect x="8" y="8" width="114" height="44" rx="14" fill="none" stroke="#E8C5B0" stroke-width="1" opacity="0.5"/>
    <text x="65" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#FAF6F0" opacity="0.8">AMOND</text>
    <text x="65" y="40" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#FAF6F0" opacity="0.6">LAVENDER &amp; ROSEMARY</text>
  </g>

  <!-- Bar 2: conditioner bar, top-right -->
  <g transform="translate(240,100) rotate(8)">
    <rect width="110" height="110" rx="24" fill="#8A9E8C"/>
    <rect x="8" y="8" width="94" height="94" rx="18" fill="none" stroke="#C5D4C6" stroke-width="1" opacity="0.5"/>
    <text x="55" y="52" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#FAF6F0" opacity="0.9">AMOND</text>
    <text x="55" y="65" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#FAF6F0" opacity="0.6">SHEA &amp; MANGO</text>
    <text x="55" y="76" text-anchor="middle" font-family="Georgia,serif" font-size="6" fill="#FAF6F0" opacity="0.5">CONDITIONER</text>
  </g>

  <!-- Bar 3: shampoo bar, bottom-center -->
  <g transform="translate(150,340) rotate(5)">
    <rect width="140" height="65" rx="22" fill="#7A5C4A"/>
    <rect x="8" y="8" width="124" height="49" rx="16" fill="none" stroke="#E8C5B0" stroke-width="1" opacity="0.4"/>
    <text x="70" y="30" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#FAF6F0" opacity="0.9">AMOND</text>
    <text x="70" y="42" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#FAF6F0" opacity="0.6">ARGAN &amp; HONEY</text>
  </g>

  <!-- Bar 4: small accent bar -->
  <g transform="translate(290,270) rotate(-6)">
    <rect width="90" height="48" rx="16" fill="#D4A88F"/>
    <rect x="6" y="6" width="78" height="36" rx="12" fill="none" stroke="#FAF6F0" stroke-width="0.8" opacity="0.4"/>
    <text x="45" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#4A3428" opacity="0.8">ROSE</text>
  </g>

  <!-- Decorative botanical elements -->
  <g opacity="0.25">
    <!-- Leaves -->
    <ellipse cx="70" cy="430" rx="6" ry="18" transform="rotate(-30,70,430)" fill="#8A9E8C"/>
    <ellipse cx="80" cy="425" rx="5" ry="15" transform="rotate(10,80,425)" fill="#5C7A5E"/>
    <ellipse cx="380" cy="140" rx="5" ry="16" transform="rotate(25,380,140)" fill="#8A9E8C"/>
    <ellipse cx="390" cy="133" rx="4" ry="13" transform="rotate(-15,390,133)" fill="#5C7A5E"/>
  </g>

  <!-- Small dots / texture -->
  <circle cx="60" cy="200" r="3" fill="#C9967A" opacity="0.3"/>
  <circle cx="400" cy="380" r="4" fill="#8A9E8C" opacity="0.3"/>
  <circle cx="340" cy="460" r="2.5" fill="#C9967A" opacity="0.25"/>
  <circle cx="100" cy="500" r="3.5" fill="#8A9E8C" opacity="0.2"/>

  <!-- Shadow under bars -->
  <ellipse cx="195" cy="570" rx="120" ry="8" fill="#4A3428" opacity="0.08"/>
</svg>

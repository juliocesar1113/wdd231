<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600">
  <rect width="480" height="600" fill="#F2DDD1"/>

  <!-- Background organic blobs -->
  <ellipse cx="240" cy="300" rx="200" ry="260" fill="#E8C5B0" opacity="0.5"/>
  <ellipse cx="320" cy="200" rx="130" ry="160" fill="#D4A88F" opacity="0.25"/>

  <!-- Workspace surface -->
  <rect x="0" y="400" width="480" height="200" rx="0" fill="#C9967A" opacity="0.2"/>
  <rect x="0" y="415" width="480" height="3" fill="#B08060" opacity="0.3"/>

  <!-- Large bowl / mixing vessel -->
  <ellipse cx="200" cy="390" rx="70" ry="20" fill="#8A9E8C" opacity="0.4"/>
  <path d="M130,370 Q130,430 200,435 Q270,430 270,370 Z" fill="#8A9E8C" opacity="0.5"/>
  <ellipse cx="200" cy="370" rx="70" ry="20" fill="#A0B8A2"/>

  <!-- Ingredients jars -->
  <g transform="translate(300,340)">
    <rect width="48" height="60" rx="8" fill="#7A5C4A"/>
    <rect x="4" y="4" width="40" height="28" rx="6" fill="#9B7A6A"/>
    <rect x="14" y="-8" width="20" height="12" rx="4" fill="#5C4035"/>
    <text x="24" y="80" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#7A5C4A" opacity="0.7">Argan Oil</text>
  </g>
  <g transform="translate(360,350)">
    <rect width="44" height="54" rx="8" fill="#C9967A"/>
    <rect x="4" y="4" width="36" height="24" rx="6" fill="#DDB090"/>
    <rect x="12" y="-7" width="20" height="11" rx="4" fill="#B07850"/>
    <text x="22" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#7A5C4A" opacity="0.7">Shea</text>
  </g>

  <!-- Dried botanicals / herbs -->
  <g opacity="0.5" transform="translate(60,300)">
    <line x1="20" y1="80" x2="20" y2="0" stroke="#8A9E8C" stroke-width="1.5"/>
    <ellipse cx="20" cy="0" rx="8" ry="5" transform="rotate(-20,20,0)" fill="#8A9E8C"/>
    <ellipse cx="12" cy="25" rx="7" ry="4" transform="rotate(15,12,25)" fill="#8A9E8C"/>
    <ellipse cx="28" cy="40" rx="7" ry="4" transform="rotate(-10,28,40)" fill="#8A9E8C"/>
  </g>
  <g opacity="0.4" transform="translate(400,280)">
    <line x1="15" y1="70" x2="15" y2="0" stroke="#C9967A" stroke-width="1.5"/>
    <ellipse cx="15" cy="5" rx="12" ry="4" transform="rotate(30,15,5)" fill="#D4A88F"/>
    <ellipse cx="8" cy="30" rx="10" ry="3" transform="rotate(-20,8,30)" fill="#D4A88F"/>
  </g>

  <!-- Finished bars displayed -->
  <g transform="translate(100,170)">
    <rect width="100" height="46" rx="14" fill="#4A3428"/>
    <rect x="6" y="6" width="88" height="34" rx="10" fill="none" stroke="#E8C5B0" stroke-width="0.8" opacity="0.5"/>
    <text x="50" y="24" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#FAF6F0" opacity="0.9">AMOND</text>
    <text x="50" y="35" text-anchor="middle" font-family="Georgia,serif" font-size="6" fill="#FAF6F0" opacity="0.6">BEAUTY</text>
  </g>
  <g transform="translate(220,155)">
    <rect width="100" height="46" rx="14" fill="#8A9E8C"/>
    <rect x="6" y="6" width="88" height="34" rx="10" fill="none" stroke="#C5D4C6" stroke-width="0.8" opacity="0.5"/>
    <text x="50" y="24" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#FAF6F0" opacity="0.9">AMOND</text>
    <text x="50" y="35" text-anchor="middle" font-family="Georgia,serif" font-size="6" fill="#FAF6F0" opacity="0.6">BEAUTY</text>
  </g>

  <!-- Heart / love detail -->
  <text x="240" y="110" text-anchor="middle" font-size="28" fill="#C9967A" opacity="0.35">♥</text>

  <!-- Tagline -->
  <text x="240" y="555" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#7A5C4A" opacity="0.6">made with care, in Denver CO</text>
</svg>

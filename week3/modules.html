<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ES Modules Activity</title>
  <link rel="stylesheet" href="styles/modules.css" />
</head>
<body>
  <main>
    <h1 id="courseName"></h1>

    <label for="sectionNumber">Choose a section:</label>
    <select id="sectionNumber"></select>

    <button id="enrollStudent">Enroll Student</button>
    <button id="dropStudent">Drop Student</button>

    <table>
      <thead>
        <tr>
          <th>Section</th>
          <th>Room</th>
          <th>Enrollment</th>
          <th>Days</th>
          <th>Instructor</th>
        </tr>
      </thead>
      <tbody id="sections"></tbody>
    </table>
  </main>

  <script type="module" src="scripts/modules.mjs"></script>
</body>
</html>
